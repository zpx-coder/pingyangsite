<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>平阳产业带官网 · UI 设计稿</title>
<style>
/* ================= 设计变量（阳光金 · 山海黛蓝 · 暖白，参照平阳站视觉规范） ================= */
:root{
  --gold:#D9A93E; --gold-2:#E8BE4C; --gold-3:#F6E7C8; --gold-d:#9A7420;
  --deep:#336065; --deep-2:#28484C; --deep-3:#1F3A3D;
  --red:#C13134;
  --tea:#A9713D;
  --ink:#1C1E1A; --body:#4A4E48; --muted:#8A8E86;
  --bg:#FFFFFF; --warm:#F7F4EC; --sand:#C7B798; --warm2:#E4E1DC; --line:#E8E4D8;
  --serif:'Songti SC','STSong','Noto Serif SC',serif;
  --sans:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --shadow:0 10px 30px rgba(31,58,61,.10);
  --shadow-lg:0 24px 60px rgba(31,58,61,.16);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--body);background:var(--bg);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{text-decoration:none;color:inherit;cursor:pointer}
.container{width:1200px;margin:0 auto}
.serif{font-family:var(--serif)}
/* ================= 按钮 ================= */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 30px;font-size:15px;font-weight:600;border-radius:2px;border:1px solid transparent;cursor:pointer;transition:.25s;position:relative;overflow:hidden;letter-spacing:2px}
.btn::before{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(105deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:.6s}
.btn:hover::before{left:130%}
.btn-gold{background:linear-gradient(135deg,var(--gold-2),var(--gold));color:#4A3208;box-shadow:0 6px 18px rgba(217,169,62,.4)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(217,169,62,.55)}
.btn-deep{background:linear-gradient(135deg,var(--deep),var(--deep-2));color:#fff;box-shadow:0 6px 18px rgba(51,96,101,.35)}
.btn-deep:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(51,96,101,.5)}
.btn-ghost{border-color:var(--line);color:var(--ink);background:#fff}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-d)}
.btn-ghost-w{border-color:rgba(255,255,255,.65);color:#fff;background:rgba(255,255,255,.08)}
.btn-ghost-w:hover{background:rgba(255,255,255,.2)}
.btn-sm{padding:8px 18px;font-size:13px;letter-spacing:1px}
/* ================= 顶栏 / 头部 / 导航 ================= */
.topbar{background:var(--gold-3);color:#6B5310;font-size:12.5px;letter-spacing:1px}
.topbar .container{height:36px;display:flex;align-items:center;justify-content:space-between}
.topbar .l{display:flex;align-items:center;gap:18px}
.topbar .r{display:flex;align-items:center;gap:18px}
.topbar .r span{cursor:pointer;transition:.2s}
.topbar .r span:hover{color:var(--gold-d)}
.lang-pill{display:flex;border:1px solid rgba(154,116,32,.45);border-radius:2px;overflow:hidden}
.lang-pill b{padding:2px 10px;font-weight:500;cursor:pointer}
.lang-pill b.on{background:var(--gold);color:#4A3208}
.site-head{background:#fff}
.site-head .container{height:92px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:64px;height:64px;flex:none;border-radius:10px;box-shadow:0 3px 10px rgba(31,58,61,.18);display:block}
.logo-tile{display:inline-flex;background:#fff;border-radius:14px;padding:6px;box-shadow:0 8px 20px rgba(0,0,0,.28);flex:none}
.logo-tile .logo{box-shadow:none;border-radius:9px}
.brand .t1{font-family:var(--serif);font-size:27px;font-weight:700;color:var(--ink);letter-spacing:3px;line-height:1.25}
.brand .t1 i{font-style:normal;color:var(--gold-d)}
.brand .t2{font-size:10.5px;color:var(--muted);letter-spacing:3.5px;text-transform:uppercase}
.head-cta{display:flex;align-items:center;gap:26px}
.head-cta .tel{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--body)}
.head-cta .tel .n{font-family:var(--serif);font-size:19px;font-weight:700;color:var(--gold-d)}
.nav{background:#fff;position:sticky;top:0;z-index:90;box-shadow:0 4px 14px rgba(31,58,61,.12);border-top:1px solid var(--line)}
.nav .container{display:flex;align-items:center}
.nav a{color:var(--ink);font-size:15.5px;letter-spacing:2px;padding:14px 26px;position:relative;transition:.2s;font-weight:500}
.nav a::after{content:"";position:absolute;left:50%;bottom:7px;width:0;height:2px;background:var(--gold);transition:.3s;transform:translateX(-50%)}
.nav a:hover::after,.nav a.on::after{width:22px}
.nav a:hover,.nav a.on{color:var(--gold-d)}
.nav .drop{position:relative}
.nav .drop-panel{position:absolute;top:100%;left:50%;transform:translateX(-50%) translateY(8px);background:#fff;width:660px;border-radius:4px;box-shadow:var(--shadow-lg);padding:18px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;opacity:0;visibility:hidden;transition:.25s;z-index:99;border-top:2px solid var(--gold)}
.nav .drop:hover .drop-panel{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.nav .drop-panel a{color:var(--ink);padding:10px 14px;border-radius:4px;display:flex;gap:10px;align-items:center;font-size:13.5px;letter-spacing:1px}
.nav .drop-panel a:hover{background:var(--gold-3)}
.nav .drop-panel a::after{display:none}
.nav .drop-panel a i{font-style:normal;font-size:18px;color:var(--gold-d)}
.nav .drop-panel a b{display:block;font-weight:600}
.nav .drop-panel a span{color:var(--muted);font-size:11.5px}
.nav-line{height:3px;background:linear-gradient(90deg,var(--gold-2) 0 55%,var(--deep) 55% 100%)}
/* ================= 首页 Hero 轮播 ================= */
.hero{position:relative;height:560px;overflow:hidden;background:var(--deep-3)}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;z-index:1}
.hero-slide.on{opacity:1;z-index:2}
.hero-slide img{width:100%;height:100%;object-fit:cover}
.hero-slide.on img{animation:kenburns 7s ease-out forwards}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09)}}
.hero-slide::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(19,37,39,.82) 8%,rgba(31,58,61,.5) 45%,rgba(31,58,61,.14) 75%)}
.hero-deco{position:absolute;right:-70px;top:-70px;z-index:4;width:340px;height:340px;border-radius:50%;border:1px solid rgba(232,190,76,.5);pointer-events:none}
.hero-deco::before{content:"";position:absolute;inset:34px;border-radius:50%;border:1px dashed rgba(232,190,76,.4)}
.hero-deco::after{content:"";position:absolute;inset:80px;border-radius:50%;background:radial-gradient(circle,rgba(232,190,76,.5),rgba(232,190,76,.08) 60%,transparent 70%)}
.hero-in{position:absolute;inset:0;z-index:3;display:flex;align-items:center}
.hero-in .container{position:relative}
.hero .kicker{display:inline-flex;align-items:center;gap:12px;color:var(--gold-2);letter-spacing:5px;font-size:13.5px;font-weight:600;opacity:0;transform:translateY(26px);transition:.8s}
.hero .kicker::before,.hero .kicker::after{content:"";width:34px;height:1px;background:var(--gold-2)}
.hero h1{font-family:var(--serif);color:#fff;font-size:52px;font-weight:800;letter-spacing:6px;margin:16px 0 14px;opacity:0;transform:translateY(26px);transition:.8s;background:linear-gradient(100deg,#fff 30%,var(--gold-3) 48%,#fff 66%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{to{background-position:-220% 0}}
.hero .sub{color:rgba(255,255,255,.88);font-size:16.5px;letter-spacing:2px;max-width:640px;opacity:0;transform:translateY(26px);transition:.8s}
.hero .ctas{margin-top:34px;display:flex;gap:16px;opacity:0;transform:translateY(26px);transition:.8s}
.hero-slide.on .kicker{opacity:1;transform:none;transition-delay:.25s}
.hero-slide.on h1{opacity:1;transform:none;transition-delay:.4s}
.hero-slide.on .sub{opacity:1;transform:none;transition-delay:.55s}
.hero-slide.on .ctas{opacity:1;transform:none;transition-delay:.7s}
.hero-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:5;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:19px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center}
.hero-arrow:hover{background:var(--deep);border-color:var(--gold-2)}
.hero-arrow.prev{left:30px}.hero-arrow.next{right:30px}
.hero-dots{position:absolute;bottom:26px;left:0;right:0;z-index:5;display:flex;gap:9px;justify-content:center}
.hero-dot{width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.45);cursor:pointer;transition:.3s}
.hero-dot.on{width:30px;background:var(--gold-2)}
.hero-idx{position:absolute;bottom:22px;right:46px;z-index:5;color:rgba(255,255,255,.9);font-family:var(--serif);font-size:15px;letter-spacing:3px}
.hero-idx b{color:var(--gold-2);font-size:24px}
/* ================= 数据带 / 走马灯 ================= */
.stat-band{margin-top:-52px;position:relative;z-index:20}
.stat-band .inner{background:#fff;border-radius:6px;box-shadow:var(--shadow-lg);display:flex;border-top:3px solid var(--gold)}
.stat{flex:1;text-align:center;padding:30px 10px;position:relative}
.stat+.stat::before{content:"";position:absolute;left:0;top:24%;bottom:24%;width:1px;background:var(--line)}
.stat .n{font-family:var(--serif);font-size:38px;font-weight:800;color:var(--deep);line-height:1.15}
.stat .n i{font-style:normal;font-size:22px;color:var(--gold-d);margin-left:2px}
.stat .l{color:var(--muted);font-size:13.5px;letter-spacing:3px;margin-top:4px}
.ticker{background:var(--sand);overflow:hidden;padding:13px 0}
.ticker .track{display:flex;width:max-content;animation:tick 26s linear infinite}
.ticker .track:hover{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
.ticker .item{display:flex;align-items:center;gap:34px;padding-right:34px;font-family:var(--serif);font-size:15.5px;color:var(--ink);letter-spacing:3px;white-space:nowrap}
.ticker .item i{font-style:normal;color:var(--gold-d);font-size:12px}
/* ================= 区块标题 / 滚动显现 ================= */
.section{padding:86px 0}
.sec-head{text-align:center;margin-bottom:52px}
.sec-head .kicker{display:inline-flex;align-items:center;gap:14px;color:var(--deep);font-size:13.5px;letter-spacing:5px;font-weight:600}
.sec-head .kicker::before,.sec-head .kicker::after{content:"";width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.sec-head .kicker::after{background:linear-gradient(90deg,var(--gold),transparent)}
.sec-head h2{font-family:var(--serif);font-size:34px;font-weight:800;color:var(--ink);letter-spacing:4px;margin:12px 0 10px}
.sec-head p{color:var(--muted);font-size:14.5px;letter-spacing:1px}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s ease,transform .8s ease}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}.rv.d4{transition-delay:.48s}
/* ================= 类目卡片 ================= */
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:26px}
.cat-card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.3s;position:relative;border:1px solid transparent}
.cat-card::before{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:linear-gradient(90deg,var(--gold),var(--tea));transform:scaleX(0);transform-origin:left;transition:.35s;z-index:3}
.cat-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.cat-card:hover::before{transform:scaleX(1)}
.cat-card .im{height:190px;overflow:hidden;position:relative}
.cat-card .im img{width:100%;height:100%;object-fit:cover;transition:.6s}
.cat-card:hover .im img{transform:scale(1.1)}
.cat-card .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(19,37,39,.5))}
.cat-card .no{position:absolute;top:14px;left:14px;z-index:2;background:rgba(51,96,101,.92);color:var(--gold-2);font-family:var(--serif);font-size:13px;padding:3px 10px;border-radius:2px;letter-spacing:2px}
.cat-card .bd{padding:22px 24px 24px}
.cat-card .bd h3{font-family:var(--serif);font-size:20px;color:var(--ink);letter-spacing:2px;display:flex;align-items:center;gap:10px}
.cat-card .bd h3 .en{font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:400}
.cat-card .bd p{color:var(--muted);font-size:13.5px;margin-top:10px}
.cat-card .more{display:flex;align-items:center;gap:8px;color:var(--gold-d);font-size:13.5px;margin-top:14px;letter-spacing:2px}
.cat-card .more i{font-style:normal;transition:.3s}
.cat-card:hover .more i{transform:translateX(6px);color:var(--tea)}
/* ================= 关于平阳（首页） ================= */
.about-split{display:grid;grid-template-columns:1.05fr 1fr;gap:64px;align-items:center}
.about-imgs{position:relative;padding-bottom:36px}
.about-imgs .big{border-radius:6px;overflow:hidden;box-shadow:var(--shadow-lg)}
.about-imgs .big img{width:100%;height:400px;object-fit:cover}
.about-imgs .small{position:absolute;right:-24px;bottom:0;width:250px;height:170px;border-radius:6px;overflow:hidden;border:6px solid #fff;box-shadow:var(--shadow-lg)}
.about-imgs .small img{width:100%;height:100%;object-fit:cover}
.about-imgs .frame{position:absolute;left:-18px;top:-18px;width:130px;height:130px;border:2px solid var(--gold);border-radius:4px;opacity:.7}
.about-txt .kicker{color:var(--deep);letter-spacing:5px;font-size:13.5px;font-weight:600}
.about-txt h2{font-family:var(--serif);font-size:32px;color:var(--ink);letter-spacing:3px;margin:12px 0 18px}
.about-txt h2 i{font-style:normal;color:var(--gold-d)}
.about-txt p{color:var(--body);margin-bottom:26px}
.about-txt .mini{display:flex;gap:34px;margin-bottom:30px}
.about-txt .mini .mn{font-family:var(--serif);font-size:26px;font-weight:800;color:var(--deep)}
.about-txt .mini .ml{font-size:12.5px;color:var(--muted);letter-spacing:2px;margin-top:2px}
/* ================= 新闻卡片 ================= */
.news-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:24px}
.news-card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.3s}
.news-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-lg)}
.news-card .im{height:160px;overflow:hidden;position:relative}
.news-card .im img{width:100%;height:100%;object-fit:cover;transition:.6s}
.news-card:hover .im img{transform:scale(1.12)}
.news-card .im .date{position:absolute;left:14px;bottom:-13px;z-index:2;background:var(--gold);color:#4A3208;border-radius:4px;padding:3px 12px;font-size:12px;letter-spacing:1px;box-shadow:0 4px 10px rgba(217,169,62,.4)}
.news-card .bd{padding:24px 20px 20px}
.news-card .bd h4{font-family:var(--serif);font-size:16.5px;color:var(--ink);line-height:1.5;height:48px;overflow:hidden;transition:.25s}
.news-card:hover .bd h4{color:var(--gold-d)}
.news-card .bd p{color:var(--muted);font-size:13px;margin-top:10px;height:40px;overflow:hidden}
/* ================= 联系带 / 页脚 ================= */
.contact-band{background:linear-gradient(120deg,var(--deep-3) 0%,var(--deep-2) 70%,var(--deep) 100%);padding:64px 0;position:relative;overflow:hidden}
.contact-band::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(232,190,76,.16) 1px,transparent 1px);background-size:26px 26px}
.contact-band .container{position:relative;display:flex;align-items:center;justify-content:space-between}
.contact-band h2{font-family:var(--serif);color:#fff;font-size:30px;letter-spacing:4px}
.contact-band h2 i{font-style:normal;color:var(--gold-2)}
.contact-band .sub{color:rgba(255,255,255,.78);font-size:14px;margin-top:8px;letter-spacing:2px}
.contact-band .items{display:flex;gap:34px;color:#fff}
.contact-band .ci{display:flex;align-items:center;gap:10px;font-size:14px}
.contact-band .ci .ic{width:40px;height:40px;border-radius:50%;border:1px solid rgba(232,190,76,.6);color:var(--gold-2);display:flex;align-items:center;justify-content:center;font-size:17px}
.site-footer{background:var(--deep-3);color:rgba(255,255,255,.75);border-top:3px solid var(--gold)}
.site-footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:44px;padding:52px 0 40px}
.site-footer h4{color:#fff;font-family:var(--serif);font-size:16px;letter-spacing:3px;margin-bottom:18px;position:relative;padding-bottom:10px}
.site-footer h4::after{content:"";position:absolute;left:0;bottom:0;width:26px;height:2px;background:var(--gold-2)}
.site-footer a{display:block;padding:5px 0;font-size:13.5px;transition:.2s}
.site-footer a:hover{color:var(--gold-2);padding-left:6px}
.site-footer .desc{font-size:13px;line-height:1.9;margin-top:14px}
.site-footer .bottom{border-top:1px solid rgba(255,255,255,.14);padding:18px 0;font-size:12.5px;display:flex;justify-content:space-between;letter-spacing:1px}
/* ================= 内页横幅 / 面包屑 ================= */
.page-banner{height:250px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.page-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kbsoft 8s ease forwards}
@keyframes kbsoft{from{transform:scale(1.12)}to{transform:scale(1)}}
.page-banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,37,39,.45),rgba(31,58,61,.74))}
.page-banner .container{position:relative;z-index:2;padding-bottom:34px}
.page-banner h1{font-family:var(--serif);color:#fff;font-size:36px;letter-spacing:6px;font-weight:800}
.page-banner h1::after{content:"";display:block;width:56px;height:3px;background:var(--gold-2);margin-top:14px}
.crumb{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:16px 0;letter-spacing:1px}
.crumb a:hover{color:var(--tea)}
.crumb .sep{color:var(--gold-d)}
.crumb .cur{color:var(--ink)}
/* ================= 内页通用 ================= */
.page-body{padding:26px 0 90px}
.card{background:#fff;border-radius:6px;box-shadow:var(--shadow);padding:34px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:34px}
.tabs button{border:none;background:none;font-size:15.5px;letter-spacing:3px;padding:13px 26px;cursor:pointer;color:var(--muted);position:relative;transition:.25s}
.tabs button::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--gold);transform:scaleX(0);transition:.3s}
.tabs button.on{color:var(--deep);font-weight:700}
.tabs button.on::after{transform:scaleX(1)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:22px}
.prod-card{background:#fff;border-radius:6px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:.3s}
.prod-card:hover{transform:translateY(-6px);box-shadow:var(--shadow-lg)}
.prod-card .im{height:190px;overflow:hidden}
.prod-card .im img{width:100%;height:100%;object-fit:cover;transition:.55s}
.prod-card:hover .im img{transform:scale(1.1)}
.prod-card .bd{padding:16px 18px 20px}
.prod-card .bd h4{font-family:var(--serif);font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card .co{color:var(--muted);font-size:12.5px;margin:6px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prod-card .pr{display:flex;justify-content:space-between;align-items:center}
.prod-card .price{color:var(--tea);font-weight:700;font-size:15px}
.prod-card .moq{color:var(--muted);font-size:12px}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.comp-card{background:#fff;border-radius:6px;box-shadow:var(--shadow);padding:24px;display:flex;gap:18px;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.comp-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--gold),var(--deep));transform:scaleY(0);transition:.3s}
.comp-card:hover{transform:translateY(-5px);box-shadow:var(--shadow-lg)}
.comp-card:hover::before{transform:scaleY(1)}
.logo-mark{width:64px;height:64px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:26px;font-weight:800;color:#fff;box-shadow:0 6px 14px rgba(0,0,0,.15)}
.comp-card h4{font-family:var(--serif);font-size:17px;color:var(--ink)}
.comp-card .en{font-size:11px;color:var(--muted);letter-spacing:.5px;margin:2px 0 8px}

/* ================= 动画初始化 ================= */
var SHOT=/[?&]shot=1/.test(location.search);
function initFx(){
  var today=document.getElementById('today');
  if(today){var d=new Date();today.textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+'日一二三四五六'[d.getDay()]}
  if(SHOT){
    document.querySelectorAll('[data-n]').forEach(function(el){el.textContent=(+el.dataset.n).toLocaleString()});
    return;
  }
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
  document.querySelectorAll('.rv').forEach(function(el){io.observe(el)});
  var cio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);cio.unobserve(e.target)}})},{threshold:.4});
  document.querySelectorAll('[data-n]').forEach(function(el){cio.observe(el)});
  var tb=document.getElementById('topbtn');
  if(!window.__scrollBound){
    window.__scrollBound=true;
    var onScroll=function(){var y=window.scrollY,doc=document.documentElement,ratio=Math.min(1,y/(doc.scrollHeight-doc.clientHeight));tb.querySelector('.ring').style.strokeDashoffset=126*(1-ratio);tb.classList.toggle('show',y>400)};
    window.addEventListener('scroll',onScroll);onScroll();
    tb.onclick=function(){window.scrollTo({top:0,behavior:'smooth'})};
  }
}
function countUp(el){
  var target=+el.dataset.n,t0=performance.now(),dur=1500;
  function step(t){var k=Math.min(1,(t-t0)/dur),v=Math.round(target*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString();if(k<1)requestAnimationFrame(step)}
  requestAnimationFrame(step);
}
if(SHOT)document.body.classList.add('shot');
window.addEventListener('hashchange',render);
