# 外层 Tengine 传入原始 /pingyang/* 路径和真实协议/IP；
# 容器仅给 Nest API、上传目录去掉前缀，Next.js 接收完整前缀。
map $http_x_real_ip $pingyang_client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

map $http_x_forwarded_proto $pingyang_public_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 2g;

    location = /pingyang {
        return 301 /pingyang/;
    }

    # 外层 Tengine 将 /pingyang 跳至带斜杠地址；Next.js 会反向规范化。
    # 内部请求交给无斜杠的 Next 根路由，以保留其语言 Cookie 跳转。
    location = /pingyang/ {
        proxy_pass http://127.0.0.1:3000/pingyang;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $pingyang_client_ip;
        proxy_set_header X-Forwarded-Proto $pingyang_public_proto;
    }

    location = /pingyang/admin {
        return 301 /pingyang/admin/;
    }

    location ^~ /pingyang/admin/ {
        alias /app/frontend/admin/dist/;
        try_files $uri $uri/ /pingyang/admin/index.html;
    }

    location ^~ /pingyang/api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $pingyang_client_ip;
        proxy_set_header X-Forwarded-For $pingyang_client_ip;
        proxy_set_header X-Forwarded-Proto $pingyang_public_proto;
        proxy_read_timeout 120s;
    }

    location ^~ /pingyang/uploads/ {
        proxy_pass http://127.0.0.1:3001/uploads/;
        proxy_set_header Host $http_host;
    }

    location ^~ /pingyang/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $pingyang_client_ip;
        proxy_set_header X-Forwarded-Proto $pingyang_public_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        alias /app/frontend/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $pingyang_client_ip;
        proxy_set_header X-Forwarded-For $pingyang_client_ip;
        proxy_set_header X-Forwarded-Proto $pingyang_public_proto;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $http_host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $pingyang_client_ip;
        proxy_set_header X-Forwarded-Proto $pingyang_public_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
